name: Deploy static site to GitHub Pages

# The legacy Jekyll builder fails on this repo (large inline-HTML pages).
# This deploys via GitHub Actions instead, publishing only _site/ (web files,
# comments stripped) built by tools/build-site.js; the rest of the repo is never served.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress prod deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build _site
        run: node tools/build-site.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # This repo's large inline-HTML pages make Pages slow to process;
          # wait up to 30 min so a slow-but-successful deploy isn't reported
          # as a failure.
          timeout: 1800000
